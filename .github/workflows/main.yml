name: Build Portable Windows Executable

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2019

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python 3.7
      uses: actions/setup-python@v4
      with:
        python-version: '3.7'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask python-docx pyinstaller==5.13.2

    - name: Build Python EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --console --add-data "converters;converters" app.py
        mkdir desktop-app\python-backend
        xcopy /E /I /Y dist\app\* desktop-app\python-backend\

    - name: Set up Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Build Single Portable Executable
      working-directory: ./desktop-app
      run: |
        npm install
        npm run dist

    - name: Upload Single Executable to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: desktop-app/dist/SoumiliConverter.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
