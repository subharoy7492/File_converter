name: Build Portable Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.7
      uses: actions/setup-python@v5
      with:
        python-version: '3.7'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask python-docx pyinstaller==5.13.2

    - name: Verify Converters Directory Exists
      run: |
        if (!(Test-Path -Path "converters")) {
          Write-Error "The 'converters' directory does not exist in root."
          exit 1
        }

    - name: Build Python EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --console --add-data "converters;converters" app.py
        if (!(Test-Path -Path "python-backend")) {
          New-Item -ItemType Directory -Path "python-backend"
        }
        xcopy /E /I /Y dist\app\* python-backend\

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build Single Portable Executable
      run: |
        npm install
        npm run dist

    - name: Upload Single Executable to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        files: dist/SoumiliConverter.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
