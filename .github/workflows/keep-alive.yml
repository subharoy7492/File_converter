
name: Streamlit Keep Alive

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-app:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Streamlit App
        env:
          APP_URL: https://ansitounicode.streamlit.app
        run: |
          echo "Checking Streamlit app..."

          HTTP_STATUS=$(curl \
            --location \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 60 \
            "$APP_URL") || HTTP_STATUS="000"

          echo "App URL: $APP_URL"
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "App responded successfully."
          else
            echo "App may be sleeping or unavailable."
            echo "Open the app manually to wake it if needed."
          fi
