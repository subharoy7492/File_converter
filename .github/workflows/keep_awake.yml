name: Keep Streamlit Awake
on:
  schedule:
    - cron: '0 */10 * * *' # Runs every 4 hours
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager

      - name: Run ping script
        env:
          APP_URL: "https://banglafontfinder.streamlit.app" # Replace with your URL
        run: |
          python -c "
          import os, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from webdriver_manager.chrome import ChromeDriverManager
          from selenium.webdriver.chrome.service import Service

          options = Options()
          options.add_argument('--headless')
          options.add_argument('--no-sandbox')
          driver = webdriver.Chrome(service=Service(ChromeDriverManager().install()), options=options)
          
          driver.get(os.environ['APP_URL'])
          time.sleep(10) # Let page load
          try:
              # Click the button if it's asleep
              btn = driver.find_by_xpath('//button[contains(text(), \"Yes, get this app back up\")]')
              btn.click()
              print('App was asleep. Clicked wake-up button!')
          except:
              print('App is already awake.')
          driver.quit()
          "
